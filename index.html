<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0b1224" id="ma-meta-theme">
  <meta name="description" content="Météo précise avec comparaison de plusieurs modèles et score de confiance.">
  <title>Météo AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ma-splash"><img src="icons/icon-192.png" alt=""><span>Météo AI</span></div>
  <div id="ma-maj-banniere" class="ma-maj-banniere hidden">
    <span>🔄 Nouvelle version disponible</span>
    <button type="button" id="ma-maj-btn">Mettre à jour</button>
  </div>
  <div class="ma-app">
    <header class="ma-entete">
      <div class="ma-lieu" id="ma-lieu-btn">
        <span id="ma-lieu-icone">📍</span>
        <span>
          <span class="ma-lieu-ligne1"><span id="ma-lieu-nom">—</span><span class="ma-chevron">⌄</span></span>
          <small id="ma-lieu-admin"></small>
        </span>
      </div>
      <div class="ma-boutons-entete">
        <button type="button" class="ma-icone-btn" id="ma-recherche-btn" title="Rechercher une ville">🔍</button>
        <button type="button" class="ma-icone-btn" id="ma-favori-btn" title="Favori">☆</button>
        <button type="button" class="ma-icone-btn" id="ma-reglages-btn" title="Réglages">⚙️</button>
      </div>
    </header>

    <main id="ma-contenu">
      <div class="ma-chargement"><div class="spin"></div>Chargement de la météo…</div>
    </main>

    <nav class="ma-tabbar" id="ma-tabbar">
      <button type="button" class="ma-tab" data-tab="accueil"><span class="ic">🏠</span>Accueil</button>
      <button type="button" class="ma-tab" data-tab="carte"><span class="ic">🗺️</span>Carte</button>
      <button type="button" class="ma-tab" data-tab="graphiques"><span class="ic">📈</span>Graphiques</button>
      <button type="button" class="ma-tab" data-tab="jours"><span class="ic">📅</span>10 jours</button>
      <button type="button" class="ma-tab" data-tab="reglages"><span class="ic">⚙️</span>Réglages</button>
    </nav>
  </div>

  <div class="ma-recherche-couche hidden" id="ma-recherche-couche">
    <div class="ma-recherche-barre">
      <input type="text" id="ma-recherche-input" placeholder="Rechercher une ville…" autocomplete="off" enterkeyhint="search">
      <button type="button" class="ma-recherche-fermer" id="ma-recherche-fermer">✕</button>
    </div>
    <button type="button" class="ma-position-inline" id="ma-position-btn">🧭 Utiliser ma position actuelle</button>
    <div id="ma-recherche-favoris"></div>
    <div id="ma-recherche-resultats"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    // Detecte une mise a jour deja installee en arriere-plan (nouveau
    // service-worker.js pousse sur GitHub) et le signale par un bandeau
    // "Mettre a jour" au demarrage, plutot que de laisser l'appli tourner
    // silencieusement sur une ancienne version jusqu'a une fermeture
    // complete -- demande explicite de Jean-Luc le 2026-10-09 ("je ne vois
    // pas de changement" apres une mise a jour deployee).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        const reg = await navigator.serviceWorker.register("service-worker.js");
        const banniere = document.getElementById("ma-maj-banniere");
        const signalerMaj = () => banniere?.classList.remove("hidden");

        if (reg.waiting && navigator.serviceWorker.controller) signalerMaj();
        reg.addEventListener("updatefound", () => {
          const nouveau = reg.installing;
          nouveau?.addEventListener("statechange", () => {
            if (nouveau.state === "installed" && navigator.serviceWorker.controller) signalerMaj();
          });
        });
        setInterval(() => reg.update(), 60 * 60 * 1000);

        document.getElementById("ma-maj-btn")?.addEventListener("click", () => {
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
